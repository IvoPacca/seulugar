<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Logs Reais — Webhook Serverless</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    pre, code {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- NAVBAR -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="text-sm font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
          ← Início
        </a>
        <div class="h-4 w-[1px] bg-slate-800"></div>
        <h2 class="text-xs sm:text-sm font-bold text-slate-100 tracking-wide uppercase">
          Monitor de Webhooks
        </h2>
      </div>

      <div class="flex items-center gap-4">
        <!-- AUTO REFRESH OPTION -->
        <div class="flex items-center gap-2">
          <span class="text-[10px] sm:text-xs text-slate-400">Auto-atualizar (5s):</span>
          <button id="toggleRefresh" onclick="toggleAutoRefresh()" class="w-10 h-6 bg-indigo-600 rounded-full flex items-center p-0.5 transition-all focus:outline-none">
            <span id="refreshIndicator" class="translate-x-4 bg-white w-5 h-5 rounded-full transition-transform"></span>
          </button>
        </div>

        <button onclick="clearLogs()" class="px-3 py-1.5 bg-red-500/15 hover:bg-red-505/20 text-red-400 rounded-lg text-xs font-bold border border-red-500/20 active:scale-95 transition-all">
          Limpar logs
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN VIEW -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    
    <!-- STATS CARD BAR -->
    <div class="bg-slate-800/40 border border-slate-800 rounded-3xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-xl font-bold text-white tracking-tight">Logs Recebidos</h1>
        <p class="text-xs text-slate-400">Verifique os dados enviados para o endpoint em tempo real.</p>
      </div>
      <div class="flex items-center gap-5 shrink-0">
        <div class="text-left">
          <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Total Recebido</span>
          <p id="totalCount" class="text-2xl font-black text-indigo-400">0</p>
        </div>
        <div class="h-8 w-[1px] bg-slate-800"></div>
        <button onclick="fetchLogs()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all">
          Atualizar Manual
        </button>
      </div>
    </div>

    <!-- ERROR NOTICE BOX -->
    <div id="errorNotice" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-2xl text-xs font-semibold">
      Não foi possível estabelecer contato com a API para listar logs.
    </div>

    <!-- WEBHOOK LOGS GRID -->
    <div id="logsContainer" class="space-y-4">
      <!-- LOADING PLACEHOLDER -->
      <div class="flex items-center justify-center py-20">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500"></div>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="py-6 border-t border-slate-850/60 text-center">
    <p class="text-xs text-slate-500">
      Histórico temporário mantido em cache serverless /tmp.
    </p>
  </footer>

  <!-- SCRIPT ENGINE -->
  <script>
    let autoRefreshActive = true;
    let refreshIntervalId = null;

    // Função de carregamento inicial
    document.addEventListener('DOMContentLoaded', () => {
      fetchLogs();
      startInterval();
    });

    function startInterval() {
      if (refreshIntervalId) clearInterval(refreshIntervalId);
      refreshIntervalId = setInterval(fetchLogs, 5000);
    }

    function toggleAutoRefresh() {
      autoRefreshActive = !autoRefreshActive;
      const indicator = document.getElementById('refreshIndicator');
      const toggleBtn = document.getElementById('toggleRefresh');

      if (autoRefreshActive) {
        indicator.classList.remove('translate-x-0');
        indicator.classList.add('translate-x-4');
        toggleBtn.classList.remove('bg-slate-700');
        toggleBtn.classList.add('bg-indigo-600');
        startInterval();
      } else {
        indicator.classList.remove('translate-x-4');
        indicator.classList.add('translate-x-0');
        toggleBtn.classList.remove('bg-indigo-600');
        toggleBtn.classList.add('bg-slate-700');
        if (refreshIntervalId) clearInterval(refreshIntervalId);
      }
    }

    // Busca os logs do endpoint de logs da API
    async function fetchLogs() {
      const errorNotice = document.getElementById('errorNotice');
      try {
        const res = await fetch('/api/logs');
        if (!res.ok) throw new Error('API Responded unfavorably');
        const data = await res.json();
        
        errorNotice.classList.add('hidden');
        document.getElementById('totalCount').innerText = data.totalCount || 0;
        
        renderLogs(data.logs || []);
      } catch (err) {
        console.error(err);
        errorNotice.classList.remove('hidden');
      }
    }

    // Renderiza a lista de logs em HTML
    function renderLogs(logs) {
      const container = document.getElementById('logsContainer');
      
      if (logs.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-850 border border-slate-800 text-center py-16 px-6 rounded-3xl space-y-4">
            <div class="h-12 w-12 rounded-full bg-slate-800 flex items-center justify-center text-xl mx-auto">
              📥
            </div>
            <p class="text-slate-400 font-medium text-sm">Nenhum webhook recebido ainda.</p>
            <p class="text-xs text-slate-500 max-w-sm mx-auto">
              Siga os passos da página inicial para enviar as primeiras requisições de teste e vê-las surgir nesta lista.
            </p>
          </div>
        `;
        return;
      }

      container.innerHTML = logs.map((log) => {
        const dateFormatted = new Date(log.timestamp).toLocaleString('pt');
        const isJson = typeof log.body === 'object';
        const formattedBody = isJson ? JSON.stringify(log.body, null, 2) : log.body;

        return `
          <div class="bg-slate-800/50 border border-slate-800 rounded-3xl p-5 md:p-6 shadow-md hover:border-slate-700 transition-all space-y-4">
            <!-- LOG HEADER BAR -->
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-700/50 pb-4">
              <div class="flex items-center gap-2.5">
                <span class="inline-flex px-2 py-0.5 bg-indigo-500/20 text-indigo-400 font-mono text-[10px] rounded uppercase font-bold">POST</span>
                <span class="text-xs font-semibold text-slate-300 font-mono select-all">${log.id}</span>
              </div>
              <div class="flex items-center gap-3 text-[11px] text-slate-450 font-semibold text-slate-400">
                <span>IP: ${log.clientIp}</span>
                <span>•</span>
                <span>${dateFormatted}</span>
              </div>
            </div>

            <!-- LOG METADATA EXPANDER -->
            <div class="space-y-3">
              <div class="text-xs text-slate-400 font-semibold mb-1">Headers do Webhook:</div>
              <div class="bg-slate-900 rounded-xl p-3 text-[10px] text-slate-400 font-mono border border-slate-800">
                content-type: ${log.headers['content-type'] || 'n/a'}<br>
                user-agent: ${log.headers['user-agent'] || 'n/a'}<br>
                X-Webhook-Secret: ***
              </div>
            </div>

            <!-- PAYLOAD DATA RAW CONTAINER -->
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs text-slate-400 font-semibold block">Payload Body:</span>
                <button onclick="copyRaw(this)" data-payload="${encodeURIComponent(formattedBody)}" class="text-[10px] text-indigo-400 hover:text-indigo-300 font-semibold px-2 py-1 bg-indigo-500/10 rounded-md transition-all">
                  Copiar Payload Raw
                </button>
              </div>
              <pre class="bg-slate-950 rounded-2xl p-4 overflow-x-auto text-[11px] text-emerald-400 font-mono border border-slate-850 leading-relaxed max-h-80">${formattedBody}</pre>
            </div>
          </div>
        `;
      }).join('');
    }

    // Funcionalidade de copiar payload individual
    function copyRaw(btn) {
      const payload = decodeURIComponent(btn.getAttribute('data-payload'));
      navigator.clipboard.writeText(payload).then(() => {
        btn.innerText = 'Copiado!';
        btn.classList.remove('bg-indigo-500/10', 'text-indigo-400');
        btn.classList.add('bg-emerald-500/10', 'text-emerald-400');
        
        setTimeout(() => {
          btn.innerText = 'Copiar Payload Raw';
          btn.classList.add('bg-indigo-500/10', 'text-indigo-400');
          btn.classList.remove('bg-emerald-500/10', 'text-emerald-400');
        }, 1500);
      });
    }

    // Limpa os logs disparando requisição DELETE para a API
    async function clearLogs() {
      if (!confirm('Deseja realmente limpar todos os logs gravados temporariamente?')) return;
      try {
        const res = await fetch('/api/logs', { method: 'DELETE' });
        if (res.ok) {
          alert('Histórico de logs limpo com sucesso!');
          fetchLogs();
        }
      } catch (err) {
        alert('Erro ao excluir histórico de logs.');
      }
    }
  </script>
</body>
</html>
